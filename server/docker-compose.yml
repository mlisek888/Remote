# Self-hosted RustDesk server: hbbs (ID/rendezvous) + hbbr (relay).
# network_mode: host -> no NAT/port-mapping problems, clients see real IPs.
# Keys (id_ed25519 / id_ed25519.pub) are generated on first start in ./data
# BACK THEM UP - if you lose them every client must be reconfigured.
services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: host
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: host
    restart: unless-stopped
