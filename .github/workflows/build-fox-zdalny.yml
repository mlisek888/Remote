# GENERATED by client/gen_workflow.py from rustdesk/rustdesk@1.5.3 CI - do not edit by hand.
# Needs repo secrets FOX_HOST (server address) and FOX_KEY (server public key).
name: Build Fox Zdalny
on:
  workflow_dispatch:
  push:
    paths:
    - client/**
    - .github/workflows/build-fox-zdalny.yml
concurrency:
  group: fox-zdalny-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  SCITER_RUST_VERSION: "1.75"
  RUST_VERSION: "1.75"
  MAC_RUST_VERSION: "1.81"
  CARGO_NDK_VERSION: "3.1.2"
  SCITER_ARMV7_CMAKE_VERSION: "3.29.7"
  SCITER_NASM_DEBVERSION: "2.15.05-1"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  FLUTTER_WINDOWS_ARM_VERSION: "3.44.9"
  FLUTTER_MACOS_ARM_VERSION: "3.44.9"
  FLUTTER_ELINUX_VERSION: "3.16.9"
  TAG_NAME: fox-zdalny
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VCPKG_CMAKE_VERSION: "4.3.0"
  ARMV7_VCPKG_COMMIT_ID: "6f29f12e82a8293156836ad81cc9bf5af41fe836"
  VERSION: "1.5.3"
  NDK_VERSION: "r28c"
  UPLOAD_ARTIFACT: 'true'
  PUBLISH_UPDATE_METADATA: 'false'
  SIGN_BASE_URL: '-2'
jobs:
  check-config:
    runs-on: ubuntu-22.04
    steps:
    - name: Check FOX_HOST / FOX_KEY secrets
      shell: bash
      env:
        FOX_HOST: ${{ secrets.FOX_HOST }}
        FOX_KEY: ${{ secrets.FOX_KEY }}
      run: |
        if [ -z "$FOX_HOST" ] || [ -z "$FOX_KEY" ]; then
          echo "::error::Set repo secrets FOX_HOST and FOX_KEY (Settings > Secrets and variables > Actions)"
          exit 1
        fi
        if ! printf %s "$FOX_KEY" | grep -Eq "^[A-Za-z0-9+/]{43}=$"; then
          echo "::error::FOX_KEY must be exactly the 44-character key from id_ed25519.pub, ending with = (got ${#FOX_KEY} characters)"
          exit 1
        fi
        echo "Server: $FOX_HOST"
  generate-bridge:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # Default bridge for every platform still on Flutter 3.24.5 (generated with 3.22.3).
        - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, extra-build-args: "", flutter-version: "3.22.3", artifact-name: "bridge-artifact"}
          # Dedicated bridge for the Windows and macOS arm64 builds (Flutter 3.44); runs in parallel.
        - {target: x86_64-unknown-linux-gnu, os: ubuntu-22.04, extra-build-args: "", flutter-version: "3.44.8", artifact-name: "bridge-artifact-flutter-3.44"}
    steps:
    - name: Checkout RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: 1.5.3
        submodules: recursive
        persist-credentials: false
    - name: Install prerequisites
      run: |
        sudo apt-get install ca-certificates -y
        sudo apt-get update -y
        sudo apt-get install -y \
          clang \
          cmake \
          curl \
          gcc \
          git \
          g++ \
          libclang-dev \
          libgtk-3-dev \
          llvm-dev \
          nasm \
          ninja-build \
          pkg-config \
          wget

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
      with:
        prefix-key: bridge-${{ matrix.job.os }}

    - name: Cache Bridge
      id: cache-bridge
      uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c   # v3
      with:
        path: /tmp/flutter_rust_bridge
        key: bridge-${{ matrix.job.flutter-version }}

    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2   # v2
      with:
        channel: "stable"
        flutter-version: ${{ matrix.job.flutter-version }}
        cache: true

    - name: Install flutter rust bridge deps
      shell: bash
      run: |
        cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
        cargo install flutter_rust_bridge_codegen --version ${{ env.FLUTTER_RUST_BRIDGE_VERSION }} --features "uuid" --locked
        if [[ "${{ matrix.job.flutter-version }}" == "3.22.3" ]]; then
          # Default Flutter 3.22.3: extended_text 14 needs a newer Dart, so downgrade for resolution.
          sed -i -e 's/extended_text: 14.0.0/extended_text: 13.0.0/g' flutter/pubspec.yaml
        else
          # Flutter 3.44 bridge for Windows/macOS arm64: match those builds' source/pubspec state so
          # the generated *.freezed.dart compiles against the same Flutter/freezed they resolve.
          bash .github/patches/apply_flutter_3.44_source_patches.sh
        fi
        pushd flutter && flutter pub get && popd

    - name: Run flutter rust bridge
      run: |
        ~/.cargo/bin/flutter_rust_bridge_codegen --rust-input ./src/flutter_ffi.rs --dart-output ./flutter/lib/generated_bridge.dart --c-output ./flutter/macos/Runner/bridge_generated.h
        cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h

    - name: Upload Artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: ${{ matrix.job.artifact-name }}
        path: |
          ./src/bridge_generated.rs
          ./src/bridge_generated.io.rs
          ./flutter/lib/generated_bridge.dart
          ./flutter/lib/generated_bridge.freezed.dart
          ./flutter/macos/Runner/bridge_generated.h
          ./flutter/ios/Runner/bridge_generated.h
    env:
      CARGO_EXPAND_VERSION: "1.0.95"
      FLUTTER_RUST_BRIDGE_VERSION: "1.80.1"
      RUST_VERSION: "1.75"
    needs:
    - check-config
  build-topmostwindow:
    runs-on: windows-2022
    strategy:
      fail-fast: false
    env:
      project_path: WindowInjection/WindowInjection.vcxproj
      build_output_dir: RustDeskTempTopMostWindow/WindowInjection/x64/Release
    steps:
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce   # v2

    - name: Download the source code
      run: |
        git clone https://github.com/rustdesk-org/RustDeskTempTopMostWindow RustDeskTempTopMostWindow

    - name: Build the project
      run: |
        cd RustDeskTempTopMostWindow && git checkout ecd8d6a139eee76845ea66423fb739af450fda90
        msbuild ${{ env.project_path }} -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10

    - name: Archive build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a   # v7.0.1
      with:
        name: topmostwindow-artifacts-x64
        path: |
          ./${{ env.build_output_dir }}/WindowInjection.dll
    needs:
    - check-config
  build-windows:
    name: ${{ matrix.job.target }}
    needs:
    - build-topmostwindow
    - generate-bridge
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          # - { target: i686-pc-windows-msvc        , os: windows-2022                  }
          # - { target: x86_64-pc-windows-gnu       , os: windows-2022                  }
        - {target: x86_64-pc-windows-msvc, os: windows-2022, arch: x86_64, flutter-arch: x64, vcpkg-triplet: x64-windows-static, build-args: "--vram"}
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410   # v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: 1.5.3
        submodules: recursive
        persist-credentials: false
    - name: Checkout Fox Zdalny branding
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: fox
        persist-credentials: false
    - name: Apply Fox Zdalny branding
      shell: bash
      env:
        FOX_HOST: ${{ secrets.FOX_HOST }}
        FOX_KEY: ${{ secrets.FOX_KEY }}
      run: python3 fox/client/apply_branding.py
    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
          # arm64 is on Flutter 3.44, so it needs the bridge generated with the same Flutter
          # (its *.freezed.dart must match the freezed the arm64 build resolves). x64 and every
          # other platform keep the default 3.22.3-generated bridge.
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./

    - name: Install LLVM and Clang
      uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0   # v2.0.9
      with:
        version: ${{ env.LLVM_VERSION }}

    - name: Install flutter
      id: flutter
        # arm64 builds with FLUTTER_WINDOWS_ARM_VERSION (>=3.44); x64 stays on FLUTTER_VERSION.
        # subosito only ships an x64 Windows SDK (Flutter's release manifest lists x64 only),
        # so it installs x64 on both arches. The arm64 runner re-bootstraps Dart to arm64 in
        # the next step.
      uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225    # v2.12.0; https://github.com/subosito/flutter-action/issues/277
      with:
        channel: "stable"
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_WINDOWS_ARM_VERSION || env.FLUTTER_VERSION }}
        architecture: x64

    - name: Force arm64 Dart SDK + engine
        # The x64 SDK subosito installs bundles an x64 Dart with a matching engine-dart-sdk.stamp,
        # so update_dart_sdk.ps1 short-circuits (stamp matches -> return) and keeps x64 Dart;
        # `flutter build windows` then targets the Dart VM's arch = x64, even on this arm64 host.
        # On this native-arm64 runner (PROCESSOR_ARCHITECTURE=ARM64), deleting the stamp and
        # re-running update_dart_sdk.ps1 pulls the arm64 Dart (available since Flutter 3.44.0).
        # https://github.com/flutter/flutter/issues/186730#issuecomment-4573214964
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: |
        $flutterRoot = "${{ steps.flutter.outputs['CACHE-PATH'] }}"
        Write-Host "PROCESSOR_ARCHITECTURE=$env:PROCESSOR_ARCHITECTURE"
        Write-Host "Flutter root: $flutterRoot"
        Remove-Item -Force "$flutterRoot\bin\cache\engine-dart-sdk.stamp" -ErrorAction SilentlyContinue
        & "$flutterRoot\bin\internal\update_dart_sdk.ps1"
        # Confirm the Dart we ended up with is arm64 ("on windows_arm64"); fail loudly if not.
        $dartVer = & "$flutterRoot\bin\dart.bat" --version 2>&1 | Out-String
        Write-Host $dartVer
        if ($dartVer -notmatch "windows_arm64") {
          Write-Error "Expected an arm64 Dart SDK but got: $dartVer"
          exit 1
        }
        & "$flutterRoot\bin\flutter.bat" precache --windows
        # Fail fast if precache pulled the wrong-arch Windows engine: an arm64 Dart should
        # fetch windows-arm64 engine artifacts. Bailing here saves the ~25min Rust build.
        $engineDir = "$flutterRoot\bin\cache\artifacts\engine"
        Write-Host "Engine artifacts present:"
        Get-ChildItem $engineDir -Directory | Select-Object -ExpandProperty Name | Write-Host
        if (-not (Test-Path "$engineDir\windows-arm64-release")) {
          Write-Error "Expected windows-arm64-release engine artifacts but they are missing (wrong-arch SDK)."
          exit 1
        }

      # https://github.com/flutter/flutter/issues/155685
      # x64 only: arm64 uses the stock native arm64 Windows engine, and the rustdesk/engine
      # windows-x64-release.zip is built for the 3.24-era x64 engine (matches FLUTTER_VERSION).
    - name: Replace engine with rustdesk custom flutter engine
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: |
        flutter doctor -v
        flutter precache --windows
        Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
        Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
        mv -Force windows-x64-release/*  C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

    - name: Patch flutter
        # x64 stays on Flutter 3.24.5, which needs the dropdown filter patch.
        # arm64 is on Flutter 3.44 (patched separately below) and does not use this patch.
      if: ${{ matrix.job.arch == 'x86_64' }}
      shell: bash
      run: |
        cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi

    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # arm64 is on Flutter 3.44 (as is macOS arm64); apply its source/pubspec deltas on the fly
        # (shared with the macOS arm64 build and the 3.44 bridge job) so the committed sources
        # stay on Flutter 3.24.5.
        # `flutter build` then runs `pub get`, regenerating pubspec.lock for the bumped deps.
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: bash .github/patches/apply_flutter_3.44_source_patches.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      with:
        toolchain: ${{ env.SCITER_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
      with:
        prefix-key: ${{ matrix.job.os }}

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2   # v11
      with:
        vcpkgDirectory: C:\vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      env:
        VCPKG_DEFAULT_HOST_TRIPLET: ${{ matrix.job.vcpkg-triplet }}
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash

    - name: Set SODIUM_LIB_DIR (arm64)
        # libsodium-sys ships no arm64 Windows prebuilt lib; point it at the vcpkg-built one
        # (only for arm64 — leaving it unset lets x64 use the crate's bundled lib).
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: echo "SODIUM_LIB_DIR=$VCPKG_ROOT/installed/${{ matrix.job.vcpkg-triplet }}/lib" >> "$GITHUB_ENV"

    - name: Build rustdesk
      run: |
        # Windows: build RustDesk
        # --hwcodec is shared by all Windows targets; per-target extras (e.g. --vram) come from the matrix
        python3 .\build.py --portable --flutter --skip-portable-pack --hwcodec ${{ matrix.job.build-args }}
        mv ./flutter/build/windows/${{ matrix.job.flutter-arch }}/runner/Release ./rustdesk

        # Download usbmmidd_v2.zip and extract it to ./rustdesk
        Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
        Expand-Archive usbmmidd_v2.zip -DestinationPath .
        Remove-Item -Path usbmmidd_v2\Win32 -Recurse
        Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
        mv -Force .\usbmmidd_v2 ./rustdesk

        # Download printer driver files and extract them to ./rustdesk
        try {
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
          Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums

          # Check and move the files
          $checksum_driver = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
          $downloadsum_driver = Get-FileHash -Path rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256
          $checksum_adapter = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
          $downloadsum_adapter = Get-FileHash -Path printer_driver_adapter.zip -Algorithm SHA256
          if ($checksum_driver -eq $downloadsum_driver.Hash -and $checksum_adapter -eq $downloadsum_adapter.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums match, extract the file."
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
          } elseif ($checksum_driver -ne $downloadsum_driver.Hash) {
              Write-Output "rustdesk_printer_driver_v4-1.4, checksums do not match, ignore the file."
          } else {
              Write-Output "printer_driver_adapter.dll, checksums do not match, ignore the file."
          }
        } catch {
            Write-Host "Ingore the printer driver error."
        }

    - name: find Runner.res
        # Windows: find Runner.res (compiled from ./flutter/windows/runner/Runner.rc), copy to ./Runner.res
        # Runner.rc does not contain actual version, but Runner.res does
      continue-on-error: true
      shell: bash
      run: |
        runner_res=$(find . -name "Runner.res");
        if [ "$runner_res" == "" ]; then
          echo "Runner.res: not found";
        else
          echo "Runner.res: $runner_res";
          cp $runner_res ./libs/portable/Runner.res;
          echo "list ./libs/portable/Runner.res";
          ls -l ./libs/portable/Runner.res;
        fi

    - name: Download RustDeskTempTopMostWindow artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      if: true
      with:
        name: ${{ matrix.job.arch == 'aarch64' && 'topmostwindow-artifacts-ARM64' || 'topmostwindow-artifacts-x64' }}
        path: "./rustdesk"

    - name: Build self-extracted executable
      shell: bash
      if: env.UPLOAD_ARTIFACT == 'true'
      run: |
        sed -i '/dpiAware/d' res/manifest.xml
        pushd ./libs/portable
        pip3 install -r requirements.txt
        python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
        popd
        mkdir -p ./SignOutput
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/FoxZdalny-${{ env.VERSION }}-${{ matrix.job.arch }}.exe

    - name: Build Fox Pomoc (support) executable
      shell: bash
      run: |
        rm -rf ./rustdesk-pomoc && cp -r ./rustdesk ./rustdesk-pomoc
        cp ./fox_variants/fox-pomoc.json ./rustdesk-pomoc/fox_custom.json
        cp ./fox/client/branding/variant-assets/fox-pomoc/* ./rustdesk-pomoc/data/flutter_assets/assets/
        pushd ./libs/portable
        python3 ./generate.py -f ../../rustdesk-pomoc/ -o . -e ../../rustdesk-pomoc/rustdesk.exe
        popd
        mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/FoxPomoc-${{ env.VERSION }}-${{ matrix.job.arch }}.exe
        ls -l ./SignOutput
    - name: Upload Fox Zdalny (Windows)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fox-windows-${{ matrix.job.arch }}
        path: ./SignOutput/Fox*.exe
        if-no-files-found: error
  build-macos:
    name: ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    needs: [generate-bridge]
    strategy:
      fail-fast: false
      matrix:
        job:
        - {target: x86_64-apple-darwin, os: macos-15-intel, extra-build-args: "", extra-cargo-features: "", arch: x86_64, vcpkg-triplet: x64-osx}
        - {target: aarch64-apple-darwin, os: macos-15, extra-build-args: "--screencapturekit", extra-cargo-features: ",screencapturekit", arch: aarch64, vcpkg-triplet: arm64-osx}
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410   # v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Checkout RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: 1.5.3
        submodules: recursive
        persist-credentials: false
    - name: Checkout Fox Zdalny branding
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: fox
        persist-credentials: false
    - name: Apply Fox Zdalny branding
      shell: bash
      env:
        FOX_HOST: ${{ secrets.FOX_HOST }}
        FOX_KEY: ${{ secrets.FOX_KEY }}
      run: python3 fox/client/apply_branding.py
    - name: Install build runtime
      run: |
        brew install llvm create-dmg
        # pkg-config is handled in a separate step, because it may be already installed by `macos-latest`(14.7.1) runner
        if command -v pkg-config &>/dev/null; then
            echo "pkg-config is already installed"
        else
            brew install pkg-config
        fi

    - name: Install NASM
      run: |
        # Install NASM 2.16.x from official release.
        # Do NOT use `brew install nasm` which installs NASM 3.x.
        # NASM 3.x is a complete rewrite with incompatible CLI options and removed features.
        # aom and other multimedia libraries require NASM 2.x for x86/x86_64 assembly.
        wget https://www.nasm.us/pub/nasm/releasebuilds/2.16.03/macosx/nasm-2.16.03-macosx.zip
        unzip nasm-2.16.03-macosx.zip
        sudo cp nasm-2.16.03/nasm /usr/local/bin/nasm
        nasm --version

    - name: Install flutter
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2   # v2
      with:
        channel: "stable"
        flutter-version: ${{ matrix.job.arch == 'aarch64' && env.FLUTTER_MACOS_ARM_VERSION || env.FLUTTER_VERSION }}

    - name: Keep CocoaPods for Flutter 3.44 (arm64)
        # 3.44 turns on Swift Package Manager by default, which would migrate Runner.xcodeproj and
        # move some plugins off CocoaPods; every plugin still ships a podspec.
      if: ${{ matrix.job.arch == 'aarch64' }}
      run: flutter config --no-enable-swift-package-manager

    - name: Patch flutter
        # Flutter 3.44 (arm64) already has this dropdown fix.
      if: ${{ matrix.job.arch == 'x86_64' }}
      run: |
        cd $(dirname $(dirname $(which flutter)))
        if [[ "3.24.5" == ${{env.FLUTTER_VERSION}} ]]; then
          git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
        fi

    - name: Workaround for flutter issue
      shell: bash
      run: |
        cd "$(dirname "$(which flutter)")"
        # https://github.com/flutter/flutter/issues/133533
        sed -i -e 's/_setFramesEnabledState(false);/\/\/_setFramesEnabledState(false);/g' ../packages/flutter/lib/src/scheduler/binding.dart
        grep -n '_setFramesEnabledState(false);' ../packages/flutter/lib/src/scheduler/binding.dart

    - name: Patch RustDesk sources for Flutter 3.44 (arm64)
        # The script uses GNU `sed -i`, which macOS's BSD sed rejects.
      if: ${{ matrix.job.arch == 'aarch64' }}
      shell: bash
      run: |
        brew install gnu-sed
        export PATH="$(brew --prefix gnu-sed)/libexec/gnubin:$PATH"
        bash .github/patches/apply_flutter_3.44_source_patches.sh

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      with:
        toolchain: ${{ env.MAC_RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32   # v2
      with:
        prefix-key: ${{ matrix.job.os }}

    - name: Restore bridge files
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
          # arm64's *.freezed.dart must match the freezed it resolves under Flutter 3.44.
        name: ${{ matrix.job.arch == 'aarch64' && 'bridge-artifact-flutter-3.44' || 'bridge-artifact' }}
        path: ./

    - name: Setup vcpkg with Github Actions binary cache
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2   # v11
      with:
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      run: |
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true

    - name: Show version information (Rust, cargo, Clang)
      shell: bash
      run: |
        clang --version || true
        rustup -V
        rustup toolchain list
        rustup default
        cargo -V
        rustc -V

    - name: Build rustdesk
      run: |
        if [ "${{ matrix.job.target }}" = "aarch64-apple-darwin" ]; then
          MIN_MACOS_VERSION="12.3"
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET\=[0-9]*.[0-9]*/MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}/" build.py
          sed -i -e "s/platform :osx, '.*'/platform :osx, '${MIN_MACOS_VERSION}'/" flutter/macos/Podfile
          sed -i -e "s/osx_minimum_system_version = \"[0-9]*.[0-9]*\"/osx_minimum_system_version = \"${MIN_MACOS_VERSION}\"/" Cargo.toml
          sed -i -e "s/MACOSX_DEPLOYMENT_TARGET = [0-9]*.[0-9]*;/MACOSX_DEPLOYMENT_TARGET = ${MIN_MACOS_VERSION};/" flutter/macos/Runner.xcodeproj/project.pbxproj
          echo "MACOSX_DEPLOYMENT_TARGET=${MIN_MACOS_VERSION}" >> "$GITHUB_ENV"
        fi
        ./build.py --flutter --hwcodec --unix-file-copy-paste ${{ matrix.job.extra-build-args }}

    - name: Rebrand app bundles
      shell: bash
      run: |
        mkdir -p ./pomoc && ditto ./flutter/build/macos/Build/Products/Release/RustDesk.app ./pomoc/RustDesk.app
        bash fox/client/macos_rebrand.sh fox/client/variants/fox-pomoc.json ./pomoc ./fox_variants/fox-pomoc.json fox/client/branding/variant-assets/fox-pomoc
        bash fox/client/macos_rebrand.sh fox/client/variants/fox-zdalny.json ./flutter/build/macos/Build/Products/Release
    - name: Create dmg
      shell: bash
      run: |
        CREATE_DMG="$(readlink -f "$(command -v create-dmg)")"
        sed -i -e 's/MAXIMUM_UNMOUNTING_ATTEMPTS=3/MAXIMUM_UNMOUNTING_ATTEMPTS=7/' "$CREATE_DMG"
        create-dmg --volname "Fox Zdalny" --icon "FoxZdalny.app" 200 190 --hide-extension "FoxZdalny.app" --window-size 800 400 --app-drop-link 600 185 FoxZdalny-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./flutter/build/macos/Build/Products/Release/FoxZdalny.app
        create-dmg --volname "Fox Pomoc" --icon "FoxPomoc.app" 200 190 --hide-extension "FoxPomoc.app" --window-size 800 400 --app-drop-link 600 185 FoxPomoc-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg ./pomoc/FoxPomoc.app
    - name: Upload Fox Zdalny (macOS)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fox-macos-${{ matrix.job.arch }}
        path: Fox*-${{ env.VERSION }}-${{ matrix.job.arch }}.dmg
        if-no-files-found: error
  build-linux:
    needs: [generate-bridge]
    name: build rustdesk linux ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.on }}
    strategy:
      fail-fast: false
      matrix:
        # use a high level qemu-user-static
        job:
        - {arch: x86_64, target: x86_64-unknown-linux-gnu, distro: ubuntu18.04, on: ubuntu-22.04, deb_arch: amd64, vcpkg-triplet: x64-linux}
    steps:
    - name: Export GitHub Actions cache environment variables
      uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410   # v6
      with:
        script: |
          core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
          core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

    - name: Maximize build space
      run: |
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /usr/share/dotnet
        sudo apt-get update -y
        sudo apt-get install -y nasm
        if [[ "${{ matrix.job.arch }}" == "x86_64" ]]; then
          sudo apt-get install -y qemu-user-static
        fi

    - name: Checkout RustDesk source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: rustdesk/rustdesk
        ref: 1.5.3
        submodules: recursive
        persist-credentials: false
    - name: Checkout Fox Zdalny branding
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: fox
        persist-credentials: false
    - name: Apply Fox Zdalny branding
      shell: bash
      env:
        FOX_HOST: ${{ secrets.FOX_HOST }}
        FOX_KEY: ${{ secrets.FOX_KEY }}
      run: python3 fox/client/apply_branding.py
    - name: Set Swap Space
      uses: pierotofy/set-swap-space@49819abfb41bd9b44fb781159c033dba90353a7c   # v1.0
      with:
        swap-size-gb: 12

    - name: Free Space
      run: |
        df -h
        free -m

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9   # v1
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        toolchain: ${{ env.RUST_VERSION }}
        targets: ${{ matrix.job.target }}
        components: "rustfmt"

    - name: Save Rust toolchain version
      run: |
        RUST_TOOLCHAIN_VERSION=$(cargo --version | awk '{print $2}')
        echo "RUST_TOOLCHAIN_VERSION=$RUST_TOOLCHAIN_VERSION" >> $GITHUB_ENV

    - name: Disable rust bridge build
      run: |
        # only build cdylib
        sed -i  "s/\[\"cdylib\", \"staticlib\", \"rlib\"\]/\[\"cdylib\"\]/g" Cargo.toml

    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: bridge-artifact
        path: ./

      # vcpkg 2026.07.29's SPDX scripts require CMake 4.3+, but this ARM64 runner selects CMake 3.31.
    - name: Setup vcpkg with Github Actions binary cache
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2   # v11
      with:
        vcpkgDirectory: /opt/artifacts/vcpkg
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
        doNotCache: false

    - name: Install vcpkg dependencies
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      run: |
        sudo apt install -y libva-dev && apt show libva-dev
        if ! $VCPKG_ROOT/vcpkg \
          install \
          --triplet ${{ matrix.job.vcpkg-triplet }} \
          --x-install-root="$VCPKG_ROOT/installed"; then
          find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
            echo "$_1:"
            echo "======"
            cat "$_1"
            echo "======"
            echo ""
          done
          exit 1
        fi
        head -n 100 "${VCPKG_ROOT}/buildtrees/ffmpeg/build-${{ matrix.job.vcpkg-triplet }}-rel-out.log" || true
      shell: bash

    - name: Restore bridge files
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c   # v8.0.1
      with:
        name: bridge-artifact
        path: ./

    - uses: rustdesk-org/run-on-arch-action@d3fcfbb632b84cf7f6bc772bfaaa2c2f4f8789a8   # no release tag; commit 2026-05-26
      name: Build rustdesk
      id: vcpkg
      if: matrix.job.arch == 'x86_64' || env.UPLOAD_ARTIFACT == 'true'
      with:
        arch: ${{ matrix.job.arch }}
        distro: ${{ matrix.job.distro }}
        githubToken: ${{ github.token }}
        setup: |
          ls -l "${PWD}"
          ls -l /opt/artifacts/vcpkg/installed
        dockerRunArgs: |
          --volume "${PWD}:/workspace"
          --volume "/opt/artifacts:/opt/artifacts"
        shell: /bin/bash
        install: |
          apt-get update -y
          echo -e "installing deps"
          apt-get install -y \
             build-essential \
             clang \
             cmake \
             curl \
             gcc \
             git \
             g++ \
             libayatana-appindicator3-dev \
             libasound2-dev \
             libclang-10-dev \
             libgstreamer1.0-dev \
             libgstreamer-plugins-base1.0-dev \
             libgtk-3-dev \
             libpulse-dev \
             libva-dev \
             libxcb-randr0-dev \
             libxcb-shape0-dev \
             libxcb-xfixes0-dev \
             libxdo-dev \
             libxfixes-dev \
             llvm-10-dev \
             nasm \
             ninja-build \
             pkg-config \
             tree \
             python3 \
             rpm \
             unzip \
             wget \
             xz-utils \
             libssl-dev
          # we have libopus compiled by us.
          apt-get remove -y libopus-dev || true
          # output devs
          ls -l ./
          tree -L 3 /opt/artifacts/vcpkg/installed
        run: |
          # disable git safe.directory
          git config --global --add safe.directory "*"
          # rust
          pushd /opt
          # do not use rustup, because memory overflow in qemu
          wget -O rust.tar.gz https://static.rust-lang.org/dist/rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}.tar.gz
          tar -zxvf rust.tar.gz > /dev/null && rm rust.tar.gz
          cd rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }} && ./install.sh
          rm -rf rust-${{env.RUST_TOOLCHAIN_VERSION}}-${{ matrix.job.target }}
          # edit config
          mkdir -p ~/.cargo/
          echo """
            [source.crates-io]
            registry = 'https://github.com/rust-lang/crates.io-index'
          """ > ~/.cargo/config
          cat ~/.cargo/config
          # start build
          pushd /workspace
          export VCPKG_ROOT=/opt/artifacts/vcpkg
          if [[ "${{ matrix.job.arch }}" == "aarch64" ]]; then
            export JOBS="--jobs 3"
          else
            export JOBS=""
          fi
          echo $JOBS
          cargo build --locked --lib $JOBS --features hwcodec,flutter,unix-file-copy-paste --release
          rm -rf target/release/deps target/release/build
          rm -rf ~/.cargo

          # Setup Flutter
          # disable git safe.directory
          git config --global --add safe.directory "*"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              export PATH=/opt/flutter-elinux/bin:$PATH
              sed -i "s/flutter build linux --release/flutter-elinux build linux --verbose/g" ./build.py
              sed -i "s/x64\/release/arm64\/release/g" ./build.py
            ;;
            x86_64)
              export PATH=/opt/flutter/bin:$PATH
            ;;
          esac
          popd
          pushd /opt
          wget https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          tar xf flutter_linux_${{ env.FLUTTER_VERSION }}-stable.tar.xz
          case ${{ matrix.job.arch }} in
            aarch64)
              # clone repo and reset to flutter ${{ env.FLUTTER_VERSION }}
              git clone https://github.com/sony/flutter-elinux.git || true
              pushd flutter-elinux
                git fetch
                git reset --hard ${{ env.FLUTTER_VERSION }}
                bin/flutter-elinux doctor -v
                bin/flutter-elinux precache --linux
              popd
              cp -R flutter/bin/cache/artifacts/engine/linux-x64/shader_lib flutter-elinux/flutter/bin/cache/artifacts/engine/linux-arm64
              rm -rf flutter
            ;;
            x86_64)
              flutter doctor -v
            ;;
          esac

          if [[ "3.24.5" == ${{ env.FLUTTER_VERSION }} ]]; then
            case ${{ matrix.job.arch }} in
              aarch64)
                pushd /opt/flutter-elinux/flutter
              ;;
              x86_64)
                pushd /opt/flutter
              ;;
            esac
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
            popd
          fi

          # build flutter
          pushd /workspace
          export CARGO_INCREMENTAL=0
          export DEB_ARCH=${{ matrix.job.deb_arch }}
          python3 ./build.py --flutter --skip-cargo
          for name in rustdesk*??.deb; do
            mv "$name" "${name%%.deb}-${{ matrix.job.arch }}.deb"
          done

          # rpm package
          echo -e "start packaging fedora package"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter.spec
              ;;
          esac
          HBB=`pwd` rpmbuild ./res/rpm-flutter.spec -bb
          pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
          for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}.rpm"
          done

          # rpm suse package
          echo -e "start packaging suse package"
          pushd /workspace
          case ${{ matrix.job.arch }} in
            aarch64)
              sed -i "s/linux\/x64/linux\/arm64/g" ./res/rpm-flutter-suse.spec
              ;;
          esac
          HBB=`pwd` rpmbuild ./res/rpm-flutter-suse.spec -bb
          pushd ~/rpmbuild/RPMS/${{ matrix.job.arch }}
          for name in rustdesk*??.rpm; do
              mv "$name" /workspace/"${name%%.rpm}-suse.rpm"
          done

    - name: Rename packages
      shell: bash
      run: |
        sudo chown -R $(id -u):$(id -g) . || true
        mkdir -p out
        mv rustdesk-${{ env.VERSION }}-${{ matrix.job.arch }}.deb out/FoxZdalny-${{ env.VERSION }}-${{ matrix.job.arch }}.deb
        for f in rustdesk-*.rpm; do case "$f" in *suse*) ;; *) mv "$f" out/FoxZdalny-${{ env.VERSION }}-${{ matrix.job.arch }}.rpm ;; esac; done
        ls -l out
    - name: Upload Fox Zdalny (Linux)
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: fox-linux-${{ matrix.job.arch }}
        path: out/*
        if-no-files-found: error
    permissions:
      contents: read
      packages: write
  release:
    needs:
    - build-windows
    - build-macos
    - build-linux
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        pattern: fox-*
        path: dist
        merge-multiple: true
    - run: ls -l dist
    - name: Draft release
      uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
      with:
        draft: true
        tag_name: fox-zdalny-${{ env.VERSION }}-${{ github.run_number }}
        name: Fox Zdalny ${{ env.VERSION }} (build ${{ github.run_number }})
        files: dist/*
    - name: Publish Fox Pomoc download links
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        mkdir -p pomoc
        cp dist/FoxPomoc-*-x86_64.exe pomoc/FoxPomoc-Windows.exe
        cp dist/FoxPomoc-*-aarch64.dmg pomoc/FoxPomoc-Mac-Apple.dmg
        cp dist/FoxPomoc-*-x86_64.dmg pomoc/FoxPomoc-Mac-Intel.dmg
        gh release delete pomoc --cleanup-tag --yes || true
        gh release create pomoc pomoc/* --target "$GITHUB_SHA" --latest=false --title "Fox Pomoc" --notes "Pobierz, uruchom i podaj ID oraz haslo osobie, ktora Ci pomaga."
